
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriv Signal Analyzer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
    }
    .app {
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      padding: 18px;
    }
    h1 { margin: 0; font-size: 24px; }
    .subtitle {
      color: #8d98a6;
      margin: 6px 0 20px;
      font-size: 14px;
    }
    .card {
      background: #151b23;
      border: 1px solid #27303b;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #9da8b5;
      margin-bottom: 8px;
    }
    select, button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
    }
    select { background: #202832; color: white; }
    button {
      margin-top: 14px;
      background: #16a34a;
      color: white;
      font-weight: bold;
    }
    button:active { transform: scale(0.98); }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #777;
      flex-shrink: 0;
    }
    .price {
      font-size: 28px;
      font-weight: bold;
      margin-top: 10px;
      word-break: break-all;
    }
    .digit { color: #9da8b5; margin-top: 5px; }
    .market-info, .diagnostic {
      color: #7f8a97;
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .diagnostic { color: #aeb8c5; font-size: 11px; }
    .result { text-align: center; padding: 26px 10px; }
    .result-title { color: #9da8b5; font-size: 13px; margin-bottom: 10px; }
    .result-main { font-size: 30px; font-weight: bold; overflow-wrap: anywhere; }
    .result-score { font-size: 16px; margin-top: 8px; color: #9da8b5; }
    .result-detail { font-size: 13px; color: #7f8a97; margin-top: 10px; line-height: 1.5; }
  </style>
</head>
<body>
<main class="app">
  <h1>Deriv Signal Analyzer</h1>
  <div class="subtitle">Live market analysis</div>

  <section class="card">
    <label for="market">Market</label>
    <select id="market">
      <option value="">Loading markets...</option>
    </select>
    <div class="market-info" id="marketInfo">Loading market data...</div>
    <div class="diagnostic" id="historyDiagnostic">History diagnostic: waiting...</div>
  </section>

  <section class="card">
    <label for="tradeType">Trade Type</label>
    <select id="tradeType">
      <option value="RISE_FALL">Rise / Fall</option>
      <option value="HIGHER_LOWER">Higher / Lower</option>
      <option value="ASIAN_UP_DOWN">Asian Up / Down</option>
      <option value="EVEN_ODD">Even / Odd</option>
      <option value="OVER_UNDER">Over / Under</option>
      <option value="MATCHES">Matches</option>
      <option value="DIFFERS">Differs</option>
      <option value="ONLY_UPS_DOWNS">Only Ups / Only Downs</option>
    </select>
    <button id="analyzeButton">ANALYZE</button>
  </section>

  <section class="card">
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Connecting to Deriv...</span>
    </div>
    <div class="price" id="price">---</div>
    <div class="digit" id="digit">Last digit: -</div>
  </section>

  <section class="card result">
    <div class="result-title">ANALYZER RESULT</div>
    <div class="result-main" id="resultMain">WAITING FOR DATA</div>
    <div class="result-score" id="resultScore">---</div>
    <div class="result-detail" id="resultDetail">Waiting for historical market data</div>
  </section>
</main>

<script>
"use strict";

const marketSelect = document.getElementById("market");
const tradeTypeSelect = document.getElementById("tradeType");
const analyzeButton = document.getElementById("analyzeButton");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const priceElement = document.getElementById("price");
const digitElement = document.getElementById("digit");
const marketInfo = document.getElementById("marketInfo");
const historyDiagnostic = document.getElementById("historyDiagnostic");
const resultMain = document.getElementById("resultMain");
const resultScore = document.getElementById("resultScore");
const resultDetail = document.getElementById("resultDetail");

let socket = null;
let currentSymbol = "";
let latestPrice = null;
let recentTicks = [];
let marketContracts = [];
let historyLoaded = false;
let requestCounter = 0;
let currentHistoryRequestId = null;
let currentContractsRequestId = null;

const HISTORY_COUNT = 200;
const MAX_TICKS = 500;

function setStatus(text, connected) {
  statusText.textContent = text;
  statusDot.style.background = connected ? "#22c55e" : "#777";
}

function setHistoryDiagnostic(text) {
  historyDiagnostic.textContent = "History diagnostic: " + text;
}

function extractLastDigit(quote) {
  const text = String(quote);
  const decimalPoint = text.indexOf(".");
  if (decimalPoint === -1) {
    const digits = text.replace(/\D/g, "");
    return digits.length ? Number(digits.slice(-1)) : null;
  }

  const decimals = text.slice(decimalPoint + 1).replace(/\D/g, "");
  return decimals.length ? Number(decimals.slice(-1)) : null;
}

function createTick(price, epoch) {
  const numericPrice = Number(price);
  if (!Number.isFinite(numericPrice)) return null;

  return {
    price: numericPrice,
    time: Number(epoch) || Date.now(),
    digit: extractLastDigit(price)
  };
}

function addTick(tick) {
  if (!tick) return;

  const last = recentTicks[recentTicks.length - 1];
  if (last && last.time === tick.time && last.price === tick.price) return;

  recentTicks.push(tick);
  if (recentTicks.length > MAX_TICKS) {
    recentTicks = recentTicks.slice(-MAX_TICKS);
  }
}

function updateLiveDisplay(tick) {
  if (!tick) return;

  latestPrice = tick.price;
  priceElement.textContent = String(tick.price);
  digitElement.textContent = "Last digit: " +
    (tick.digit === null ? "-" : tick.digit);
  marketInfo.textContent = "Historical + live ticks: " + recentTicks.length;
}

function showWait(detail) {
  resultMain.textContent = "WAIT";
  resultScore.textContent = "No reliable edge established";
  resultDetail.textContent = detail;
}

function connect() {
  setStatus("Connecting to Deriv...", false);

  socket = new WebSocket(
    "wss://api.derivws.com/trading/v1/options/ws/public"
  );

  socket.onopen = function() {
    setStatus("Connected — loading markets...", true);
    socket.send(JSON.stringify({ active_symbols: "brief" }));
  };

  socket.onmessage = function(event) {
    let data;

    try {
      data = JSON.parse(event.data);
    } catch (error) {
      console.error("Invalid Deriv message:", event.data);
      setHistoryDiagnostic("Received a non-JSON WebSocket message.");
      return;
    }

    if (data.error) {
      const message = data.error.message || data.error.code || "Unknown Deriv error";
      console.error("Deriv error:", data.error);

      if (data.req_id === currentHistoryRequestId) {
        historyLoaded = false;
        setHistoryDiagnostic("HISTORY REQUEST ERROR — " + message);
        showWait("Deriv rejected the historical tick request.");
      }

      if (data.req_id === currentContractsRequestId) {
        marketContracts = [];
        marketInfo.textContent = "Tick data is available; contract information could not be loaded.";
      }

      setStatus("Deriv error: " + message, false);
      return;
    }

    if (data.msg_type === "active_symbols") {
      loadMarkets(data.active_symbols || []);
      return;
    }

    if (data.msg_type === "history") {
      handleHistory(data);
      return;
    }

    if (data.msg_type === "tick") {
      handleLiveTick(data.tick);
      return;
    }

    if (data.msg_type === "contracts_for") {
      handleContracts(data);
    }
  };

  socket.onerror = function() {
    setStatus("Connection error", false);
    setHistoryDiagnostic("WebSocket connection error.");
  };

  socket.onclose = function() {
    setStatus("Disconnected — refresh the page to reconnect", false);
  };
}

function loadMarkets(markets) {
  const usable = markets
    .filter(market => market && market.underlying_symbol)
    .sort((a, b) =>
      (a.underlying_symbol_name || a.underlying_symbol)
        .localeCompare(b.underlying_symbol_name || b.underlying_symbol)
    );

  marketSelect.innerHTML = "";

  usable.forEach(market => {
    const option = document.createElement("option");
    option.value = market.underlying_symbol;
    option.textContent = market.underlying_symbol_name || market.underlying_symbol;
    marketSelect.appendChild(option);
  });

  if (usable.length) {
    marketSelect.value = usable[0].underlying_symbol;
    subscribeToMarket(marketSelect.value);
  } else {
    setStatus("No active markets returned", false);
  }
}

function subscribeToMarket(symbol) {
  if (!socket || socket.readyState !== WebSocket.OPEN || !symbol) return;

  currentSymbol = symbol;
  recentTicks = [];
  marketContracts = [];
  historyLoaded = false;
  latestPrice = null;
  currentHistoryRequestId = null;
  currentContractsRequestId = null;

  priceElement.textContent = "---";
  digitElement.textContent = "Last digit: -";
  marketInfo.textContent = "Loading historical data...";
  setHistoryDiagnostic("Requesting history for " + symbol + "...");

  resultMain.textContent = "LOADING DATA";
  resultScore.textContent = "---";
  resultDetail.textContent = "Loading recent ticks for " + symbol;
  setStatus("Loading " + symbol + " history...", true);

  socket.send(JSON.stringify({ forget_all: "ticks" }));

  const historyRequestId = ++requestCounter;
  currentHistoryRequestId = historyRequestId;

  // One-time history request: deliberately omit subscribe.
  socket.send(JSON.stringify({
    ticks_history: symbol,
    end: "latest",
    count: HISTORY_COUNT,
    style: "ticks",
    req_id: historyRequestId
  }));

  const contractsRequestId = ++requestCounter;
  currentContractsRequestId = contractsRequestId;

  socket.send(JSON.stringify({
    contracts_for: symbol,
    req_id: contractsRequestId
  }));

  // Keep the live tick subscription enabled.
  socket.send(JSON.stringify({
    ticks: symbol,
    subscribe: 1,
    req_id: ++requestCounter
  }));
}

function handleHistory(data) {
  if (data.req_id && data.req_id !== currentHistoryRequestId) return;

  const history = data.history;
  if (!history || !Array.isArray(history.prices) || !Array.isArray(history.times)) {
    setHistoryDiagnostic("History response did not contain usable price/time arrays.");
    showWait("Historical ticks could not be read.");
    return;
  }

  const length = Math.min(history.prices.length, history.times.length);
  recentTicks = [];

  for (let i = 0; i < length; i++) {
    const tick = createTick(history.prices[i], history.times[i]);
    if (tick) recentTicks.push(tick);
  }

  recentTicks = recentTicks.slice(-MAX_TICKS);
  historyLoaded = recentTicks.length > 0;

  if (!historyLoaded) {
    setHistoryDiagnostic("History returned no usable ticks.");
    showWait("No usable historical data is available.");
    return;
  }

  const last = recentTicks[recentTicks.length - 1];
  updateLiveDisplay(last);
  setStatus("Historical data loaded — receiving live ticks", true);
  setHistoryDiagnostic(
    "SUCCESS — Deriv returned " + length +
    " history entries. " + recentTicks.length + " usable ticks loaded."
  );

  resultMain.textContent = "READY";
  resultScore.textContent = recentTicks.length + " ticks available";
  resultDetail.textContent = "Choose a trade type and press ANALYZE.";
}

function handleLiveTick(tickData) {
  if (!tickData || (tickData.symbol && tickData.symbol !== currentSymbol)) return;

  const tick = createTick(tickData.quote, tickData.epoch);
  if (!tick) return;

  addTick(tick);
  updateLiveDisplay(tick);
  setStatus("Receiving live ticks", true);

  if (historyLoaded) {
    resultDetail.textContent = "Live data updating. Press ANALYZE for a fresh result.";
  }
}

function handleContracts(data) {
  if (data.req_id && data.req_id !== currentContractsRequestId) return;

  const contractData = data.contracts_for;
  marketContracts = contractData && Array.isArray(contractData.available)
    ? contractData.available
    : [];

  if (marketContracts.length) {
    marketInfo.textContent = recentTicks.length +
      " ticks loaded • " + marketContracts.length + " contract types available";
  }
}

function getLastDigits(count) {
  return recentTicks
    .slice(-count)
    .map(tick => tick.digit)
    .filter(Number.isInteger);
}

function analyzeEvenOdd() {
  const digits = getLastDigits(160);

  if (digits.length < 100) {
    return {
      signal: "WAIT",
      score: "---",
      detail: "Need at least 100 usable digits for this analysis."
    };
  }

  let even = 0;
  let odd = 0;

  digits.forEach(digit => {
    if (digit % 2 === 0) even++;
    else odd++;
  });

  const total = even + odd;
  const evenRate = even / total;
  const oddRate = odd / total;
  const edge = Math.abs(evenRate - oddRate);

  if (edge < 0.08) {
    return {
      signal: "WAIT",
      score: "Even/Odd difference: " + (edge * 100).toFixed(1) + " percentage points",
      detail: "The recent sample does not show a sufficiently clear difference."
    };
  }

  return {
    signal: evenRate > oddRate ? "EVEN" : "ODD",
    score: "Observed frequency: " +
      (Math.max(evenRate, oddRate) * 100).toFixed(1) + "%",
    detail: "Observed in " + total + " recent digits from " + currentSymbol +
      ". This is historical frequency, not a guaranteed next-tick probability."
  };
}

function analyzeMatches() {
  const digits = getLastDigits(160);

  if (digits.length < 100) {
    return {
      signal: "WAIT",
      score: "---",
      detail: "Matches needs at least 100 usable last digits."
    };
  }

  const counts = Array(10).fill(0);

  digits.forEach(digit => {
    if (Number.isInteger(digit) && digit >= 0 && digit <= 9) {
      counts[digit]++;
    }
  });

  const total = counts.reduce((sum, count) => sum + count, 0);
  if (!total) {
    return {
      signal: "WAIT",
      score: "---",
      detail: "No usable digits were found in the selected market."
    };
  }

  const ranked = counts
    .map((count, digit) => ({
      digit,
      count,
      rate: count / total
    }))
    .sort((a, b) => b.rate - a.rate);

  const best = ranked[0];
  const second = ranked[1];
  const baseline = 0.10;
  const advantage = best.rate - baseline;
  const separation = best.rate - second.rate;

  // Conservative screen: do not treat a small random lead as a signal.
  if (best.rate < 0.13 || separation < 0.025) {
    return {
      signal: "WAIT",
      score: "Leading digit: " + best.digit +
        " (" + (best.rate * 100).toFixed(1) + "% observed)",
      detail: "No digit has a sufficiently clear lead in " + total +
        " recent digits from " + currentSymbol +
        ". A past frequency difference does not guarantee the next digit."
    };
  }

  const heuristicStrength = Math.min(
    95,
    Math.round(50 + advantage * 250 + separation * 200)
  );

  return {
    signal: "MATCHES " + best.digit,
    score: "Heuristic strength: " + heuristicStrength + "/100",
    detail: "Digit " + best.digit + " appeared " + best.count +
      " times in " + total + " recent digits (" +
      (best.rate * 100).toFixed(1) + "% observed). This score is a screening measure, not a win probability."
  };
}

function runAnalysis() {
  if (!currentSymbol) {
    showWait("Select a market.");
    return;
  }

  if (!historyLoaded || recentTicks.length < 100) {
    showWait("Waiting for enough historical and live data.");
    return;
  }

  const type = tradeTypeSelect.value;
  let result;

  if (type === "MATCHES") {
    result = analyzeMatches();
  } else if (type === "EVEN_ODD") {
    result = analyzeEvenOdd();
  } else {
    result = {
      signal: "NOT IMPLEMENTED",
      score: "---",
      detail: "This trade type does not have its analysis model yet. Matches and Even/Odd are the only implemented models in this version."
    };
  }

  resultMain.textContent = result.signal;
  resultScore.textContent = result.score;
  resultDetail.textContent = result.detail;
}

marketSelect.addEventListener("change", function() {
  subscribeToMarket(marketSelect.value);
});

analyzeButton.addEventListener("click", runAnalysis);

tradeTypeSelect.addEventListener("change", function() {
  resultMain.textContent = historyLoaded ? "READY" : "LOADING DATA";
  resultScore.textContent = historyLoaded ? recentTicks.length + " ticks available" : "---";
  resultDetail.textContent = historyLoaded
    ? "Press ANALYZE for " +
      tradeTypeSelect.options[tradeTypeSelect.selectedIndex].text + "."
    : "Waiting for historical data.";
});

connect();
</script>
</body>
</html>
